
name: Build LA-2A VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $plugins = Get-ChildItem -Path build -Recurse `
            -Directory -Filter "*.vst3" `
            -ErrorAction SilentlyContinue

          foreach ($p in $plugins) {
            Copy-Item $p.FullName `
              (Join-Path "artifacts" $p.Name) `
              -Recurse -Force
          }

          $exes = Get-ChildItem -Path build -Recurse `
            -File -Filter "*.exe" `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "Standalone" }

          foreach ($e in $exes) {
            Copy-Item $e.FullName "artifacts" -Force
          }

          if (-not (Get-ChildItem artifacts -Force |
              Select-Object -First 1)) {
            Write-Error "No plugin artifacts found."
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LA2A-Windows-VST3
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
